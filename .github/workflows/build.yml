name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".gitignore"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".gitignore"

  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (release)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tags
        run: git fetch --prune --tags --force

      - name: Resolve version
        id: version
        run: echo "version=$(git describe --tags --always | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Select Xcode version
        run: |
          ls -d /Applications/Xcode*.app || true
          if [ -d /Applications/Xcode_15.1.app ]; then
            sudo xcode-select --switch /Applications/Xcode_15.1.app
          fi
          echo "Active developer dir: $(xcode-select -p)"
          xcodebuild -version

      - name: Bootstrap Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils
          cache: true
          cache-path: ~/__cache

      - name: Build release
        run: make RELEASE=1

      - name: Upload packages to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release package
          path: ${{ github.workspace }}/packages/*

      - name: Upload packages to release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || steps.version.outputs.version }}
          name: ellekit ${{ steps.version.outputs.version }}
          files: |
            ${{ github.workspace }}/packages/*.deb
          fail_on_unmatched_files: true
